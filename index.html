<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calculadora Sofisticada</title>

    <!-- PWA: manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA: cor do tema (barra de status/navegação no Android) -->
    <meta name="theme-color" content="#0f1115">

    <!-- PWA: ícones para Android/Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Comportamento de app instalado -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculadora">

    <!-- Google Fonts: Inter para um visual minimalista e moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(25, 29, 36, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Evita seleção acidental de texto tipo "app nativo" */
            -webkit-tap-highlight-color: transparent;
        }

        .calculator-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .header span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 400;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 17, 21, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        select {
            cursor: pointer;
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .btn-calcular {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-calcular:hover {
            background: var(--accent-hover);
        }

        .btn-calcular:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            padding: 16px;
            background: rgba(15, 17, 21, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result-box.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .result-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .result-value.error {
            color: var(--error-color);
            font-size: 1rem;
        }

        .footer-credits {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        #installBtn {
            display: none;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        #installBtn.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="header">
            <h1>Calculadora Python ➔ Web</h1>
            <span>By Luan • 2026</span>
        </div>

        <div class="input-group">
            <label for="numero1">Primeiro Número</label>
            <input type="number" id="numero1" placeholder="Digite um número...">
        </div>

        <div class="input-group">
            <label for="numero2">Segundo Número</label>
            <input type="number" id="numero2" placeholder="Digite um número...">
        </div>

        <div class="input-group">
            <label for="operacao">Operação</label>
            <select id="operacao">
                <option value="soma">Soma (+)</option>
                <option value="subtração">Subtração (-)</option>
                <option value="multiplicação">Multiplicação (×)</option>
                <option value="divisão">Divisão (÷)</option>
            </select>
        </div>

        <button class="btn-calcular" onclick="executarCalculadora()">Calcular Resultado</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">O Resultado é:</div>
            <div id="resultValue" class="result-value">0</div>
        </div>

        <button id="installBtn">📲 Instalar aplicativo</button>

        <div class="footer-credits">
            Desenvolvido com design minimalista
        </div>
    </div>

    <script>
        // Função equivalente à sua função 'calculadora' do Python
        function calculadora(a, b, operacao) {
            if (operacao === "soma") {
                return a + b;
            } else if (operacao === "subtração") {
                return a - b;
            } else if (operacao === "multiplicação") {
                return a * b;
            } else if (operacao === "divisão") {
                if (b === 0) {
                    return "Erro: Divisão por zero!";
                }
                return a / b;
            } else {
                return "Não foi possível realizar a operação.";
            }
        }

        // Função que simula o fluxo do input/output da interface
        function executarCalculadora() {
            const num1Input = document.getElementById('numero1').value;
            const num2Input = document.getElementById('numero2').value;
            const operacao = document.getElementById('operacao').value;
            const resultBox = document.getElementById('resultBox');
            const resultValue = document.getElementById('resultValue');

            // Tratamento de ValueError semelhante ao Python
            if (num1Input === "" || num2Input === "") {
                resultValue.textContent = "Erro: Por favor, preencha ambos os números.";
                resultValue.className = "result-value error";
                resultBox.classList.add('active');
                return;
            }

            const numero1 = parseFloat(num1Input);
            const numero2 = parseFloat(num2Input);

            // Processamento
            const resultado = calculadora(numero1, numero2, operacao);

            // Exibição da saída
            resultValue.textContent = resultado;
            
            if (typeof resultado === 'string' && resultado.startsWith("Erro")) {
                resultValue.className = "result-value error";
            } else {
                resultValue.className = "result-value";
            }

            resultBox.classList.add('active');
        }

        // ----- PWA: registro do Service Worker -----
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registrado:', reg.scope))
                    .catch((err) => console.error('Falha ao registrar Service Worker:', err));
            });
        }

        // ----- PWA: botão de instalação personalizado (Android/Chrome) -----
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            installBtn.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            installBtn.classList.remove('show');
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.remove('show');
            console.log('App instalado com sucesso!');
        });
    </script>
</body>
</html>
